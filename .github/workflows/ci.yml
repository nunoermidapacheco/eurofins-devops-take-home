  name: Continuous Integration

  on: 
      push: 
          branches:
              - main

  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        # Checkout and setup
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: '10.0.x'
        
        # Restore and build
        - name: Restore dependencies
          run: dotnet restore HelloWorld/HelloWorld.csproj

        - name: Build application
          run: dotnet build HelloWorld/HelloWorld.csproj --no-restore
      
        # Publish
        - name: Publish application
          run: dotnet publish HelloWorld/HelloWorld.csproj --output ./publish

        # Package
        - name: Create ZIP package
          run: cd publish && zip -r ../HelloWorld.zip .
        
        - name: Upload ZIP artifact
          uses: actions/upload-artifact@v7
          with:
            name: HelloWorld
            path: HelloWorld.zip
      
        # Docker build
        - name: Build Docker image
          run: docker build -t helloworld:latest ./HelloWorld

        # Smoke test
        - name: Test Docker container
          run: |
            docker run -d -p 8080:8080 --name helloworld helloworld:latest
            sleep 5
            curl http://localhost:8080

        # Docker Hub push
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: nunopacheco
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Tag Docker image
          run: |
            SHORT_SHA=${GITHUB_SHA::7}
            docker tag helloworld:latest nunopacheco/helloworld:latest
            docker tag helloworld:latest nunopacheco/helloworld:$SHORT_SHA

        - name: Push Docker image
          run: docker push --all-tags nunopacheco/helloworld